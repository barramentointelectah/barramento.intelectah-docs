              QtdDiariasSolicitadas: 1
              QtdDiariasAutorizadas: 1
              Guias:
              - TipoGuia: 0
                NrGuia: '123456'
                Senha: '654321'
                Status: 3
                DataSolicitacao: '2023-07-10'
                DataAutorizacao: '2023-07-12'
                DataValidade: '2023-09-12'
              Procedimentos:
