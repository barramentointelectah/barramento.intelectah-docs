openapi: 3.0.3
info:
  title: Barramento de Integração — Neoh × HIS
  version: '1.0'
  description: 'Barramento de integração entre o **Neoh** (agendamento cirúrgico) e o **HIS** (sistema de gestão hospitalar). Especificação genérica de contrato — independente do HIS de destino.


    Documentado nos **dois sentidos**:


    - **Neoh → HIS**: rotas que o Neoh consome do barramento. Autenticação por **Bearer token**; base no servidor do HIS (`{baseUrl}`).

    - **HIS → Neoh**: callbacks que o HIS envia à API do Neoh. Autenticação por headers **`client_id`/`client_secret`**; base no servidor do Neoh.


    Cada operação declara em `servers` a base correta e o `security` do seu sentido. Onde o corpo de resposta não tem schema de campos publicado, isso é indicado explicitamente na descrição da rota.'
servers:
- url: '{baseUrl}'
  description: Base do HIS (barramento). Usada por TODAS as rotas do sentido Neoh → HIS. Host + prefixo do barramento, fornecido pela Intelectah/HIS por ambiente.
  variables:
    baseUrl:
      default: https://barramento.hospital.example
      description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
- url: https://neohapi{ambiente}-eastus2.azurewebsites.net
  description: Base da API do Neoh. Usada pelos callbacks do sentido HIS -> Neoh.
  variables:
    ambiente:
      enum:
      - hml
      - prd
      default: hml
      description: 'Hml = neohapihml-eastus2; prd = neohapiprd-eastus2. Confirmar o host canônico com a Intelectah por ambiente antes de publicar ao cliente.'
tags:
- name: Neoh→HIS · Autenticação
  description: Emissão/revogação do Bearer token do Barramento (credenciais em headers hifenizados).
- name: Neoh→HIS · Paciente & Cadastro
  description: Localização e cadastro (simplificado/completo) do paciente no HIS.
- name: Neoh→HIS · Agenda & Mapa
  description: Consulta de disponibilidade, geração de horários, atualização e cancelamento de agenda, mapa cirúrgico.
- name: Neoh→HIS · Dados de Referência
  description: Endpoint único /dados-referencia com 19 entidades de lookup selecionadas por `entidade`.
- name: Neoh→HIS · Integrar Pedido
  description: Criação/atualização/remoção dos itens de um Pedido Cirúrgico. 15 áreas sob /integrar-pedido/*, todas POST, roteando por campo `action` no item.
- name: Neoh→HIS · Edição de Pedido
  description: Endpoints standalone usados na EDIÇÃO de um pedido já existente, fora da orquestração de /integrar-pedido.
- name: HIS→Neoh · Callbacks
  description: Callbacks que o HIS envia para a API do Neoh. Base = servidor Neoh; auth por headers client_id/client_secret.
- name: Neoh→HIS · Portal do Médico & Painel (novas APIs)
  description: 'APIs de leitura (GET) para Portal do Médico e Painel Cirúrgico: grade de OPME, checklist de material, procedimentos associados, tempo médio e sugestão de diárias. Contratos funcionais; rotas propostas.'
security:
- bearerAuth: []
paths:
  /token:
    post:
      tags:
      - Neoh→HIS · Autenticação
      operationId: emitirToken
      summary: Emite o Bearer token (client_credentials)
      security: []
      servers:
      - url: '{baseUrl}'
        description: Base do HIS (barramento). Usada por todas as rotas do sentido Neoh → HIS.
        variables:
          baseUrl:
            default: https://barramento.hospital.example
            description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
      parameters:
      - name: Client-ID
        in: header
        required: true
        schema:
          type: string
        description: Client ID
      - name: Client-Secret
        in: header
        required: true
        schema:
          type: string
        description: Client secret
      - name: Grant-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - client_credentials
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
              example:
                access_token: eyJhbGciOi...
                token_type: Bearer
        '400':
          description: '|'
        '401':
          description: ''
    delete:
      tags:
      - Neoh→HIS · Autenticação
      operationId: revogarToken
      summary: Revoga o token ativo
      security: []
      servers:
      - url: '{baseUrl}'
        description: Base do HIS (barramento). Usada por todas as rotas do sentido Neoh → HIS.
        variables:
          baseUrl:
            default: https://barramento.hospital.example
            description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
      parameters:
      - name: Client-ID
        in: header
        required: true
        schema:
          type: string
      - name: Client-Secret
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token revogado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        '400':
          description: ''
        '401':
          description: ''
        '404':
          description: ''
  /consultar-paciente:
    get:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: consultarPaciente
      summary: Localiza o paciente no HIS (2 modos)
      security:
      - bearerAuth: []
      parameters:
      - name: idBupUnidade
        in: query
        required: true
        schema:
          type: integer
        description: Código da unidade.
      - name: nrAtendimento
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 1: número do atendimento no HIS.'
      - name: cpf
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: CPF do paciente (11 dígitos, sem máscara).'
      - name: nome
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: nome (ou parte) do paciente.'
      - name: dataNascimento
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Modo 2: data de nascimento (yyyy-MM-dd).'
      responses:
        '200':
          description: Envelope com a lista de pacientes encontrados (vazia se nenhum).
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultaPaciente:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultaPacienteItem'
              example:
                consultaPaciente:
                - cdPaciente: 456
                  nomePaciente: PACIENTE TESTE
                  sexoPaciente: M
                  dataNascimento: '1980-01-01'
                  nomeMae: MAE TESTE
                  cpfPaciente: '12345678911'
                  email: teste@teste.com
                  ddiCelular: 55
                  dddCelular: 11
                  celular: '999998888'
                  cep: '55555000'
                  endereco: Rua Teste
                  numero: 5
                  bairro: Centro
                  cidade: Recife
                  uf: PE
                  pais: Brasil
                  codigoAtendimento: 123456
                  codigoConvenio: 1
                  dsConvenio: Convenio X
                  codigoPlano: 1
                  dsPlano: Plano Y
                  numeroCarteirinha: '123456789'
                  pacienteOncologico: N
        '400':
          description: Nenhum critério de busca informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
        '401':
          description: Sem token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: "Consulta o paciente no HIS. Dois modos de busca, ambos retornando o **mesmo envelope** `{ \"consultaPaciente\": [ ... ] }` (array, mesmo para 1 paciente):\n\n- **Por nº de atendimento** — enviar `idBupUnidade` + `nrAtendimento`.\n- **Por dados do paciente** — enviar `idBupUnidade` + ao menos um de `cpf` / `nome` / `dataNascimento`.\n\nOrigem no código: `Barramento.cs › ConsultarPacienteGeralAsync`, `PacienteBarramentoDTO`, `ItemPacienteBarramentoGeral`."
  /cadastro-simplificado:
    post:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: cadastroSimplificado
      summary: Cria paciente mínimo
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroSimplificadoRequest'
            example:
              nomePaciente: PACIENTE TESTE
              dtNascimento: '1990-01-01'
              sexo: M
              usuario: NEOH
              docPacienteCPF: '12345678900'
      responses:
        '200':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  codPaciente:
                    type: integer
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
  /cadastro-completo:
    post:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: cadastroCompleto
      summary: Cria paciente completo (+)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroCompletoRequest'
            example:
              idBUPUnidade: 61
              NomePaciente: PACIENTE TESTE
              SexoPaciente: M
              DataNascimento: '1990-01-01'
              NomeMae: MAE TESTE
              CpfPaciente: '12345678900'
              Email: teste@teste.com
              Cep: 01000-000
              Endereco: RUA TESTE
              Numero: 100
              Bairro: CENTRO
              Cidade: SAO PAULO
              Uf: SP
      responses:
        '200':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  codPaciente:
                    type: integer
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
  /agenda-disponivel:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: agendaDisponivel
      summary: IDs de agenda disponíveis para uma sala/data
      security:
      - bearerAuth: []
      parameters:
      - name: idSala
        in: query
        required: true
        schema:
          type: integer
        description: Id da sala.
      - name: dataCirurgia
        in: query
        required: true
        schema:
          type: string
        description: Data da cirurgia (yyyy-MM-dd HH:mm:ss).
      responses:
        '200':
          description: Array de agendas disponíveis (1..N).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    NR_SEQUENCIA:
                      type: integer
                      description: Id da agenda.
              example:
              - NR_SEQUENCIA: 12345
              - NR_SEQUENCIA: 54321
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: 'Retorna os identificadores de agenda (`NR_SEQUENCIA`) disponíveis para uma sala em uma data. Origem no código: `Barramento.cs › ObterIdAgendaDisponivelAsync`, `AgendaBarramentoDto`.'
  /gerar-horario-livre:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: gerarHorarioLivre
      summary: Gera vagas livres (fire-and-forget)
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
      - name: salas
        in: query
        required: true
        schema:
          type: string
        description: CSV de códigos de agenda
      - name: dataInicio
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFim
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: usuario
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Corpo vazio — fire-and-forget, cliente não consome o body
          content:
            application/json:
              schema:
                type: object
                description: Sempre `{}`.
        '400':
          description: Campo obrigatório ausente, ou dataInicio posterior a dataFim (comparação lexicográfica YYYY-MM-DD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
  /agenda-paciente:
    post:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: atualizarAgendaPaciente
      summary: Atualiza a cabeça da agenda cirúrgica do paciente
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgendaPacienteRequest'
            example:
              idAgenda: 3688948222
              loginUsuario: NEOH
              dtNascimento: '1972-10-25 00:00:00'
              ieAnestesia: S
              ieAutorizacao: PA
              nmPaciente: PACIENTE TESTE
              qtIdadePaciente: 50
              qtIdadeMes: 5
              telefone: '11941142639'
              dtPrevistaInternacao: '2026-08-25 05:00:00'
              cdProcedimento: 195175
              statusAgenda: M
              catAtendimento: E
              idConvenio: 340
              idPaciente: 1652889
              ieOrigemProced: O
              idBupPlano: '21'
              idMedico: 40095
              idCategoriaConvenio: 2
              nrSeqProcInterno: 195175
      responses:
        '200':
          description: Agenda atualizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  idAgenda:
                    type: integer
                  ieStatusAgenda:
                    type: string
                  status:
                    type: string
                    example: atualizado
        '400':
          description: Campo obrigatório ausente ou corpo esparso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
        '404':
          description: Agenda não existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
  /cancelar:
    post:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: cancelarAgenda
      summary: Cancela agendamento cirúrgico
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - agendaPaciente
              - usuario
              - motivoCancelamento
              - descrCancelamento
              properties:
                agendaPaciente:
                  type: integer
                  description: Sequencial da agenda a cancelar
                usuario:
                  type: string
                motivoCancelamento:
                  type: string
                  description: Código do motivo (ver /dados-referencia?entidade=motivo-cancelamento)
                descrCancelamento:
                  type: string
                cdPerfil:
                  type: integer
                  default: 1848
                  description: Perfil de sessão
            example:
              agendaPaciente: 3688948222
              usuario: NEOH
              motivoCancelamento: '1'
              descrCancelamento: Paciente desistiu
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: integer
                  mensagem:
                    type: string
                  agendaPaciente:
                    type: integer
                  numeroCirurgia:
                    type: string
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
  /mapa-cirurgico:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: mapaCirurgico
      summary: Mapa de horários e equipamentos de um bloco
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
        description: Código do estabelecimento.
      - name: idBloco
        in: query
        required: true
        schema:
          type: integer
        description: Id do bloco.
      - name: data
        in: query
        required: true
        schema:
          type: string
        description: Data de referência (yyyy-MM-dd HH:mm:ss).
      - name: diaSemana
        in: query
        required: true
        schema:
          type: integer
        description: Dia da semana.
      - name: usuario
        in: query
        required: true
        schema:
          type: string
        description: Login do usuário.
      - name: codigosEquipamento
        in: query
        required: false
        schema:
          type: string
        description: CSV de códigos de equipamento. Se presente, popula as listas de equipamento.
      responses:
        '200':
          description: Mapa cirúrgico (objeto composto).
          content:
            application/json:
              schema:
                type: object
                properties:
                  HorariosLivres:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioLivre'
                  HorariosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioOcupado'
                  HorarioEquipamentosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoOcupado'
                  EquipamentosDisponiveis:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoDisponivel'
              example:
                HorariosLivres:
                - id: 1
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 08:00:00'
                  dataFim: '2023-06-30 08:30:00'
                  status: L
                HorariosOcupados:
                - id: 1
                  cdAviso: 123456
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 09:30:00'
                  dataFim: '2023-06-30 10:30:00'
                  duracao: '2023-06-30 01:00:00'
                  tempoLimpeza: '2023-06-30 00:10:00'
                  status: O
                  dsCirurgia: Artrodese de coluna
                  idMedico: 65422
                  nmMedico: Médico fulano de tal
                HorarioEquipamentosOcupados:
                - IDEQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  DATAINICIO: '2023-06-30 13:00:00'
                  DATAFIM: '2023-06-30 15:00:00'
                  IDSALA: 1
                  QTDUTILIZADA: 1
                EquipamentosDisponiveis:
                - ID_EQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  QT_DISPONIVEL: 4
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: 'Mapa de horários (livres/ocupados) e equipamentos de um bloco em uma data. Origem no código: `Barramento.cs › ListarDadosMapaCirurgicoAsync` e DTOs relacionados (`MapaCirurgicoBarramentoDto`, `HorarioLivreBarramentoDto`, `HorarioOcupadoBarramentoDto`, `HorarioEquipamentoOcupadoBarramentoDto`, `EquipamentoDisponivelBarramentoDto`).'
  /dados-referencia:
    get:
      tags:
      - Neoh→HIS · Dados de Referência
      operationId: dadosReferencia
      summary: Tabelas de referência (19 entidades)
      security:
      - bearerAuth: []
      parameters:
      - name: entidade
        in: query
        required: true
        schema:
          type: string
          enum:
          - bloco
          - conselho
          - equipamento
          - fornecedor
          - motivo-cancelamento
          - motivo-transferencia
          - opme
          - procedimento
          - sala
          - tipo-uti
          - sangue
          - caixa
          - especialidade
          - convenio
          - plano
          - categoria
          - cobertura
          - medico
          - anestesista
        description: Entidade de lookup
      - name: cdEstabelecimento
        in: query
        required: false
        schema:
          type: integer
        description: Obrigatório para bloco/equipamento/motivo-cancelamento/motivo-transferencia/opme/sala/tipo-uti/caixa/convenio/medico; ignorado nas demais.
      - name: idConvenio
        in: query
        required: false
        schema:
          type: integer
        description: Opcional em plano/categoria; OBRIGATÓRIO em cobertura.
      - name: tipoAgenda
        in: query
        required: false
        schema:
          type: string
          default: T
        description: Só motivo-cancelamento
      - name: situacao
        in: query
        required: false
        schema:
          type: string
          default: A
        description: Só motivo-cancelamento
      responses:
        '200':
          description: Array puro (14 entidades) OU envelope de objeto (5 entidades). O formato depende de `entidade` — ver tabela na descrição.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Bloco'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Conselho'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Equipamento'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Fornecedor'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_MotivoCancelamento'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_MotivoTransferencia'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Procedimento'
                - $ref: '#/components/schemas/DR_Opme'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_TipoUti'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Sala'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Sangue'
                - $ref: '#/components/schemas/DR_Caixa'
                - $ref: '#/components/schemas/DR_Especialidade'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Convenio'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Plano'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Categoria'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Cobertura'
                - $ref: '#/components/schemas/DR_Medico'
                - $ref: '#/components/schemas/DR_Anestesista'
              examples:
                bloco_array_puro:
                  summary: entidade=bloco (array puro)
                  value:
                  - ID_BLOCO: 1
                    DS_BLOCO: Bloco A
                opme_envelope_Dados:
                  summary: entidade=opme (envelope Dados)
                  value:
                    Dados:
                    - CD_PRODUTO: 123
                      DS_PRODUTO: Prótese X
                      CD_PRO_FAT: '123'
                      CD_TUSS: 789
                      CD_SUS: '123'
                especialidade_envelope:
                  summary: entidade=especialidade (envelope Especialidades)
                  value:
                    Especialidades:
                    - idBupEspecialidade: 10
                      nomeEspecialidade: Ortopedia
                anestesista_envelope:
                  summary: entidade=anestesista (envelope Profissionais)
                  value:
                    Profissionais:
                    - IdMedico: 1
                      Cpf: '12345678901'
                      Nome: Dr. Fulano
                      CustomId: 1
                      Email: a@a.com
                      Numero: '999999999'
        '400':
          description: 'Campo obrigatório ausente (ex.: idConvenio em cobertura)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: "Endpoint único que retorna 19 entidades de lookup, selecionadas por `entidade`. **14 entidades retornam array puro**; **5 retornam envelope de objeto** — `opme`→`{Dados:[…]}`, `medico`→`{Dados:[…]}`, `caixa`→`{results:[…]}`, `especialidade`→`{Especialidades:[…]}`, `anestesista`→`{Profissionais:[…]}`.\n\n**Filtros por entidade (contrato funcional):**\n\n| Entidade | Filtros | Envelope |\n|---|---|---|\n| bloco | idBupUnidade, classifSetor(O), situacao, tipoAgenda | array |\n| conselho | idBupUnidade, sgConselho, situacao | array |\n| equipamento | idBupUnidade, situacao, tipoEquip | array |\n| fornecedor | idBupUnidade, situacao, fornecedorOPME | array |\n| motivo-cancelamento | idBupUnidade, tipoAgenda, situacao | array |\n| motivo-transferencia | idBupUnidade, motivo, situacao, cirurgia | array |\n| procedimento | idBupUnidade, situacao, tipoProcedimento | array |\n| opme | idBupUnidade | Dados |\n| sala | idBupUnidade, situacao, tipoAgenda | array |\n| tipo-uti | idBupUnidade, cdClassificacao, situacao | array |\n| sangue | idBupUnidade, situacao, tipo, tipoServico | array |\n| caixa | idBupUnidade, situacao, cdEstabelecimento | results |\n| especialidade | idBupUnidade, situacao, cdEstabelecimento | Especialidades |\n| convenio | situacao, cdMultiEmpresa | array |\n| plano | idBupUnidade, situacao, cdMultiEmpresa | array |\n| categoria | cdMultiEmpresa | array |\n| cobertura | idBupUnidade | array |\n| medico | (auth) | Dados |\n| anestesista | idBupUnidade, situacao | Profissionais |\n\nObs.: no código atual (`Barramento.cs`, região \"Carga de dados\"), a maioria dos filtros acima é aplicada pela **URL configurada por hospital**, não montada em C#; o C# substitui `@cdEstabelecimento`/`@cdMultiEmpresa` e resolve token/URL por hospital."
