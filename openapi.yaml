          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GuiaAutorizacaoLoteResultItem'
              example:
              - CdAvisoCirurgia: 9999
                LoginHis: daniel.koga
                QtdDiariasSolicitadas: 1
                QtdDiariasAutorizadas: 1
                HasError: false
                ErrorMessage:
                Guias:
                - TipoGuia: 0
                  NrGuia: '123456'
                  Senha: '654321'
                  Status: 3
                  DataSolicitacao: '2023-07-10T00:00:00'
                  DataAutorizacao: '2023-07-12T00:00:00'
                  DataValidade: '2023-09-12T00:00:00'
                Procedimentos:
                - CdCirurgia: 393
                  CustomIdGuia: 0
                  QtdAutorizada: 1
                  QtdSolicitada: 1
                Opmes: []
              - CdAvisoCirurgia: 123456
                LoginHis: daniel.koga
                QtdDiariasSolicitadas: 1
                QtdDiariasAutorizadas: 1
                HasError: true
                ErrorMessage: Dados do pedido não encontrado
                Guias: []
                Procedimentos: []
