components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token do Barramento (sentido Neoh→HIS). Obtido em POST /token.
    clientId:
      type: apiKey
      in: header
      name: client_id
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
    clientSecret:
      type: apiKey
      in: header
      name: client_secret
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
  schemas:
    RespostaErroNeoh:
      type: object
      description: Envelope de erro padrão do Barramento (WrapError, incondicional).
      properties:
        sucesso:
          type: integer
          example: 0
        mensagem:
          type: string
    MensagemResposta:
      type: object
      description: Resposta padrão dos callbacks HIS→Neoh (sucesso e 400 individual).
      properties:
        Message:
          type: string
    CadastroSimplificadoRequest:
      type: object
      required:
      - nomePaciente
      - dtNascimento
      - sexo
      - usuario
      properties:
        nomePaciente:
          type: string
        dtNascimento:
          type: string
          format: date
          description: YYYY-MM-DD
        sexo:
          type: string
          enum:
          - M
          - F
        usuario:
          type: string
        docPacienteCPF:
          type: string
          description: Chave de dedup
        docPacienteRNE:
          type: string
        docPacientePassport:
          type: string
        idBUPUnidade:
          type: integer
          description: Aceito, não bindado
    CadastroCompletoRequest:
      type: object
      required:
      - idBUPUnidade
      - NomePaciente
      - SexoPaciente
      - DataNascimento
      - NomeMae
      - CpfPaciente
      properties:
        idBUPUnidade:
          type: integer
        NomePaciente:
          type: string
        SexoPaciente:
          type: string
          enum:
          - M
          - F
        DataNascimento:
          type: string
          description: YYYY-MM-DD
        NomeMae:
          type: string
          description: Grava tipo-5
        CpfPaciente:
          type: string
          description: Chave de dedup
        Email:
          type: string
        DdiTelefone:
          type: integer
        DddTelefone:
          type: integer
        Telefone:
          type: string
        DdiCelular:
          type: integer
        DddCelular:
          type: integer
        Celular:
          type: string
        Cep:
          type: string
        Endereco:
          type: string
        Numero:
          type: integer
        Complemento:
          type: string
        Bairro:
          type: string
        Cidade:
          type: string
        Uf:
          type: string
        Pais:
          type: string
          description: Sem lookup de código de país
    AgendaPacienteRequest:
      type: object
      required:
      - idAgenda
      - loginUsuario
      - dtNascimento
      - ieAnestesia
      - nmPaciente
      - qtIdadePaciente
      - qtIdadeMes
      - telefone
      - dtPrevistaInternacao
      - catAtendimento
      - idConvenio
      - idPaciente
      - idBupPlano
      properties:
        idAgenda:
          type: integer
          description: Aceita alias nrSequencia
        loginUsuario:
          type: string
          description: Aceita alias login
        dtNascimento:
          type: string
          format: date-time
        ieAnestesia:
          type: string
        ieAutorizacao:
          type: string
          description: Opcional; fallback = valor atual da linha
        nmPaciente:
          type: string
        qtIdadePaciente:
          type: integer
        qtIdadeMes:
          type: integer
        telefone:
          type: string
        dtPrevistaInternacao:
          type: string
          format: date-time
        cdProcedimento:
          type: integer
          description: Opcional; fallback = valor atual da linha
        statusAgenda:
          type: string
          description: Opcional; fallback = valor atual, senão N
        catAtendimento:
          type: string
          description: Aceita alias caraterAtendimento
        idConvenio:
          type: integer
          description: Aceita alias idBupConvenio
        idPaciente:
          type: integer
        ieOrigemProced:
          type: string
          description: Opcional; fallback = valor atual da linha
        idBupPlano:
          type: string
        idMedico:
          type: integer
          description: Opcional; fallback = valor atual da linha
        idCategoriaConvenio:
          type: integer
          description: Opcional; fallback = valor atual da linha
        nrSeqProcInterno:
          type: integer
          description: Opcional; fallback = valor atual da linha
        usuarioOrigem:
          type: string
          description: Opcional; fallback = loginUsuario (nome não confirmado)
        dtAgendamento:
          type: string
          format: date-time
          description: Opcional; fallback = timestamp de save (nome não confirmado)
    CirurgiaAgendaRequest:
      type: object
      required:
      - idBupUnidade
      - idAgenda
      - loginUsuario
      properties:
        idBupUnidade:
          type: integer
        idAgenda:
          type: integer
        loginUsuario:
          type: string
          description: Aceita fallback `login`
        dtNascimento:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
          format: date-time
        ieAnestesia:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        ieAutorizacao:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        nmPaciente:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        telefone:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        dtPrevistaInternacao:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
          format: date-time
        cdProcedimento:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        catAtendimento:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        idConvenio:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        idPaciente:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        ieOrigemProced:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        idBupPlano:
          type: string
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        idMedico:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        idCategoriaConvenio:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        nrSeqProcInterno:
          type: integer
          description: Não validado por Validate, mas usado em Execute — omitir pode gravar valor vazio
        statusAgenda:
          type: string
          description: 'Precedência: payload > status atual > N'
        cdPerfil:
          type: integer
          default: 1848
    EquipamentoItem:
      type: object
      required:
      - action
      - idEquipamento
      properties:
        action:
          type: string
          enum:
          - new
          - delete
        idEquipamento:
          type: integer
        ieObrigatorio:
