      description: '**Escopo:** comum a todos os HIS.



        > **Uma URL por entidade.** No código o Neoh **não** chama um endpoint único: faz uma requisição
        separada para cada entidade, e cada uma tem a sua própria URL, configurada por hospital num parâmetro.
        O `entidade` abaixo é a forma de organizar esta página — não é um query string da API. Use a tabela
        para saber qual parâmetro guarda a URL de cada carga.


        | Entidade | Parâmetro que guarda a URL |

        |---|---|

        | `bloco` | `barramento_url_get_blocos` |

        | `conselho` | `barramento_url_get_conselhos` |

        | `equipamento` | `barramento_url_get_equipamentos` |

        | `fornecedor` | `barramento_url_get_fornecedores` |

        | `motivo-cancelamento` | `barramento_url_get_motivos_cancelamento` |

        | `motivo-transferencia` | `barramento_url_get_motivos_transferencia` |

        | `opme` | `barramento_url_get_opmes` |

        | `procedimento` | `barramento_url_get_procedimentos` |

        | `sala` | `barramento_url_get_salas` |

        | `tipo-uti` | `barramento_url_get_unidades_uti` |

        | `sangue` | `barramento_url_get_sangue_derivados` |

        | `caixa` | `barramento_url_get_caixas` |

        | `plano` | `barramento_url_get_planos` |

        | `medico`, `anestesista`, `especialidade`, `convenio`, `categoria`, `cobertura` | a URL chega
        pronta ao barramento, vinda do serviço de carga do hospital |


        `convenio` e `procedimento` mudam de formato conforme o perfil de integração (Token ou MDM) —
        veja os dois schemas de cada um na resposta.


        ---


        Endpoint único que retorna 19 entidades de lookup, selecionadas por `entidade`. **14 entidades
        retornam array puro**; **5 retornam envelope de objeto** — `opme`→`{Dados:[…]}`, `medico`→`{Dados:[…]}`,
        `caixa`→`{results:[…]}`, `especialidade`→`{Especialidades:[…]}`, `anestesista`→`{Profissionais:[…]}`.


        **Filtros por entidade (contrato funcional):**


        | Entidade | Filtros | Envelope |

        |---|---|---|

        | bloco | idBupUnidade, classifSetor(O), situacao, tipoAgenda | array |

        | conselho | idBupUnidade, sgConselho, situacao | array |

        | equipamento | idBupUnidade, situacao, tipoEquip | array |

        | fornecedor | idBupUnidade, situacao, fornecedorOPME | array |

        | motivo-cancelamento | idBupUnidade, tipoAgenda, situacao | array |

        | motivo-transferencia | idBupUnidade, motivo, situacao, cirurgia | array |

        | procedimento | idBupUnidade, situacao, tipoProcedimento | array |

        | opme | idBupUnidade | Dados |

        | sala | idBupUnidade, situacao, tipoAgenda | array |

        | tipo-uti | idBupUnidade, cdClassificacao, situacao | array |

        | sangue | idBupUnidade, situacao, tipo, tipoServico | array |

        | caixa | idBupUnidade, situacao, cdEstabelecimento | results |

        | especialidade | idBupUnidade, situacao, cdEstabelecimento | Especialidades |

        | convenio | situacao, cdMultiEmpresa | array |

        | plano | idBupUnidade, situacao, cdMultiEmpresa | array |

        | categoria | cdMultiEmpresa | array |

        | cobertura | idBupUnidade | array |

        | medico | (auth) | Dados |

        | anestesista | idBupUnidade, situacao | Profissionais |


        Obs.: no código atual (`Barramento.cs`, região "Carga de dados"), a maioria dos filtros acima
        é aplicada pela **URL configurada por hospital**, não montada em C#; o C# substitui `@cdEstabelecimento`/`@cdMultiEmpresa`
        e resolve token/URL por hospital.'
      x-escopo: geral
