        CdMultiEmpresa:
          type: integer
          description: Código da unidade/multi-empresa.
        UsuarioHis:
          type: string
          description: Login do usuário no HIS.
        DsObservacoes:
          type: string
          nullable: true
          description: Observação do cancelamento.
        DataInicioCirurgia:
          type: string
          nullable: true
          description: Início da cirurgia, em `yyyy-MM-dd HH:mm:ss`.
        IdSala:
          type: integer
          nullable: true
          description: Sala da cirurgia cancelada.
    CancelamentoAgendaAntigoRequest:
      type: object
      description: 'Corpo da **rota antiga** de cancelamento (objeto `CancelamentoBarramentoAntigo`),
        usado só quando o hospital tem `barramento_usar_rota_antiga_cancelar` ligado. Mantido aqui para
        os hospitais que ainda estão nessa configuração; integração nova deve usar `CancelamentoAgendaRequest`.
