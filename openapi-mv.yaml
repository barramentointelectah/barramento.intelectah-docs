components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token do Barramento (sentido Neoh→HIS). Obtido em POST /token.
    clientId:
      type: apiKey
      in: header
      name: client_id
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
    clientSecret:
      type: apiKey
      in: header
      name: client_secret
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
  schemas:
    RespostaErroNeoh:
      type: object
      description: Envelope de erro padrão do Barramento (WrapError, incondicional).
      properties:
        sucesso:
          type: integer
          example: 0
        mensagem:
          type: string
    MensagemResposta:
      type: object
      description: Resposta padrão dos callbacks HIS→Neoh (sucesso e 400 individual).
      properties:
        Message:
          type: string
    IntegrarPedidoMvRequest:
      type: object
      description: 'Pedido cirúrgico inteiro, num POST único. É o corpo do perfil MV (parâmetro `token_com_form_url_encoded`
        ligado): em vez das rotas item a item de `/integrar-pedido/*`, o Neoh envia cabeçalho e listas
        numa só requisição. Gerado a partir do objeto `IntegracaoPedido` e conferido campo a campo contra
        o código.

        '
      properties:
        CdMultiEmpresa:
          type: integer
        TpSituacao:
          type: string
        CdPaciente:
          type: integer
          nullable: true
        NmPaciente:
          type: string
        TpIdade:
          type: string
        Sexo:
          type: string
        IdSala:
          type: integer
          nullable: true
        IdBloco:
          type: integer
          nullable: true
        UsuarioHis:
          type: string
        Telefone:
          type: string
        DataPrevistaInternacao:
          type: string
        CdTipoInternacao:
          type: integer
          nullable: true
        DataPrevistaAlta:
          type: string
        CaraterAtendimento:
          type: string
        Duracao:
          type: string
        IdCid:
          type: string
        Peso:
          type: number
          nullable: true
        Idade:
          type: integer
          nullable: true
        Uti:
          type: string
        Tecnica:
          type: string
        Robotica:
          type: string
        TpNatureza:
          type: string
        ObservacoesExtras:
          type: string
        CodAtendimento:
          type: integer
          nullable: true
        NrCarteira:
          type: string
        Ambulatorial:
          type: string
        CdUnidadeUti:
          type: integer
          nullable: true
        DtInclusao:
          type: string
        Sangue:
          type: string
        Congelacao:
          type: string
        DtInicioCirurgia:
          type: string
        DtFimCirurgia:
          type: string
        TempoPreparo:
          type: string
        CdEquipeMedica:
          type: integer
          nullable: true
        CdTipoAnestesia:
          type: string
        CdConvenio:
          type: integer
          format: int64
          nullable: true
        CdPlano:
          type: integer
          nullable: true
        TpAgendamento:
          type: string
        CdFornecedor:
          type: integer
          format: int64
          nullable: true
        Procedimentos:
