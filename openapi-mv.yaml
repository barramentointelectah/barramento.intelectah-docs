openapi: 3.0.3
info:
  title: Barramento de Integração — Neoh × HIS · MV
  version: '1.0'
  description: 'Tudo que um hospital MV precisa: as rotas comuns mais as especificas do MV.


    A documentação do barramento é separada por HIS: **Geral** (vale para qualquer HIS), **Tasy** e **MV**.
    Cada operação traz o seu escopo no início da descrição. As abas Tasy e MV são autocontidas — trazem
    as rotas comuns mais as do seu HIS —, então quem integra um hospital Tasy lê só a aba Tasy.


    Os callbacks **HIS → Neoh** valem para qualquer HIS.


    ---


    Barramento de integração entre o **Neoh** (agendamento cirúrgico) e o **HIS** (sistema de gestão hospitalar).
    Especificação genérica de contrato — independente do HIS de destino.


    Documentado nos **dois sentidos**:


    - **Neoh → HIS**: rotas que o Neoh consome do barramento. Autenticação por **Bearer token**; base
    no servidor do HIS (`{baseUrl}`).

    - **HIS → Neoh**: callbacks que o HIS envia à API do Neoh. Autenticação por headers **`client_id`/`client_secret`**;
    base no servidor do Neoh.

    - **Perfis de integração**: algumas rotas do sentido Neoh → HIS têm duas variantes, **Token** e **MDM**,
    com verbo e corpo diferentes. O perfil vigente é definido por configuração do hospital. Cada operação
    declara o seu em `x-perfil-integracao`. Hoje isso afeta `/cancelar` e `/troca-fase`.

    - **Estado de implementação**: as rotas marcadas com `x-implementacao` têm o contrato publicado mas
    ainda não são consumidas pelo Neoh nesta versão.


    Cada operação declara em `servers` a base correta e o `security` do seu sentido. Onde o corpo de resposta
    não tem schema de campos publicado, isso é indicado explicitamente na descrição da rota.'
servers:
- url: '{baseUrl}'
  description: Base do HIS (barramento). Usada por TODAS as rotas do sentido Neoh → HIS. Host + prefixo
    do barramento, fornecido pela Intelectah/HIS por ambiente.
  variables:
    baseUrl:
      default: https://barramento.hospital.example
      description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
- url: https://neohapi{ambiente}-eastus2.azurewebsites.net
  description: Base da API do Neoh. Usada pelos callbacks do sentido HIS -> Neoh.
  variables:
    ambiente:
      enum:
      - hml
      - prd
      default: hml
      description: Hml = neohapihml-eastus2; prd = neohapiprd-eastus2.
tags:
- name: Neoh→HIS · Autenticação
  description: Emissão do Bearer token do Barramento (credenciais em headers `client_id`/`client_secret`/`grant_type`).
- name: Neoh→HIS · Dados de Referência
  description: Endpoint único /dados-referencia com 19 entidades de lookup selecionadas por `entidade`.
- name: Neoh→HIS · Agenda & Mapa
  description: Consulta de disponibilidade, geração de horários, atualização e cancelamento de agenda,
    mapa cirúrgico.
- name: Neoh→HIS · Paciente & Cadastro
  description: Localização e cadastro (simplificado/completo) do paciente no HIS.
- name: Neoh→HIS · Integrar Pedido
  description: Criação/atualização/remoção dos itens de um Pedido Cirúrgico. 15 áreas sob /integrar-pedido/*,
    todas POST, roteando por campo `action` no item.
- name: Neoh→HIS · Edição de Pedido
  description: Endpoints standalone usados na EDIÇÃO de um pedido já existente, fora da orquestração de
    /integrar-pedido.
- name: Neoh→HIS · Portal do Médico & Painel (novas APIs)
  description: 'APIs de leitura (GET) para Portal do Médico e Painel Cirúrgico: grade de OPME, checklist
    de material, procedimentos associados, tempo médio e sugestão de diárias. Contratos funcionais; rotas
    propostas.'
- name: HIS→Neoh · Callbacks
  description: Callbacks que o HIS envia para a API do Neoh. Base = servidor Neoh; auth por headers client_id/client_secret.
security:
- bearerAuth: []
paths:
  /token:
    post:
      tags:
      - Neoh→HIS · Autenticação
      operationId: emitirToken
      summary: Emite o Bearer token (client_credentials)
      description: '**Escopo:** comum a todos os HIS.



        Credenciais enviadas em **headers**. A requisição não tem corpo.


        O token devolvido é aplicado nas demais rotas do sentido Neoh → HIS no header `Authorization:
        {token_type} {access_token}`.'
      security: []
      servers:
      - url: '{baseUrl}'
        description: Base do HIS (barramento). Usada por todas as rotas do sentido Neoh → HIS.
        variables:
          baseUrl:
            default: https://barramento.hospital.example
            description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
          example: neoh
        description: Identificador de acesso, fornecido pela equipe do barramento.
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
          example: neoh123
        description: Segredo de acesso, fornecido pela equipe do barramento.
      - name: grant_type
        in: header
        required: true
        schema:
          type: string
          enum:
          - client_credentials
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - token_type
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    description: Validade do token, em segundos.
                    example: 3600
              example:
                access_token: abc1234
                token_type: bearer
                expires_in: 3600
        '400':
          description: Credenciais ausentes ou malformadas.
        '401':
          description: Credenciais inválidas.
      x-escopo: geral
  /consultar-paciente:
    get:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: consultarPaciente
      summary: Localiza o paciente no HIS (2 modos)
      security:
      - bearerAuth: []
      parameters:
      - name: idBupUnidade
        in: query
        required: true
        schema:
          type: integer
        description: Código da unidade.
      - name: nrAtendimento
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 1: número do atendimento no HIS.'
      - name: cpf
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: CPF do paciente (11 dígitos, sem máscara).'
      - name: nome
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: nome (ou parte) do paciente.'
      - name: dataNascimento
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Modo 2: data de nascimento (yyyy-MM-dd).'
      responses:
        '200':
          description: Envelope com a lista de pacientes encontrados (vazia se nenhum).
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultaPaciente:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultaPacienteItem'
              example:
                consultaPaciente:
                - cdPaciente: 456
                  nomePaciente: PACIENTE TESTE
                  sexoPaciente: M
                  dataNascimento: '1980-01-01'
                  nomeMae: MAE TESTE
                  cpfPaciente: '12345678911'
                  email: teste@teste.com
                  ddiCelular: 55
                  dddCelular: 11
                  celular: '999998888'
                  cep: '55555000'
                  endereco: Rua Teste
                  numero: 5
                  bairro: Centro
                  cidade: Recife
                  uf: PE
                  pais: Brasil
                  codigoAtendimento: 123456
                  codigoConvenio: 1
                  dsConvenio: Convenio X
                  codigoPlano: 1
                  dsPlano: Plano Y
                  numeroCarteirinha: '123456789'
                  pacienteOncologico: N
        '400':
          description: Nenhum critério de busca informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
        '401':
          description: Sem token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: '**Escopo:** comum a todos os HIS.



        Consulta o paciente no HIS. Dois modos de busca, ambos retornando o **mesmo envelope** `{ "consultaPaciente":
        [ ... ] }` (array, mesmo para 1 paciente):


        - **Por nº de atendimento** — enviar `idBupUnidade` + `nrAtendimento`.

        - **Por dados do paciente** — enviar `idBupUnidade` + ao menos um de `cpf` / `nome` / `dataNascimento`.


        Origem no código: `Barramento.cs › ConsultarPacienteGeralAsync`, `PacienteBarramentoDTO`, `ItemPacienteBarramentoGeral`.'
      x-escopo: geral
  /cadastro-simplificado:
    post:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: cadastroSimplificado
      summary: Cria paciente mínimo
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroSimplificadoRequest'
            example:
              nomePaciente: PACIENTE TESTE
              dtNascimento: '1990-01-01'
              sexo: M
              usuario: NEOH
              docPacienteCPF: '12345678900'
      responses:
        '200':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  codPaciente:
                    type: integer
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
      description: '**Escopo:** comum a todos os HIS.'
  /cadastro-completo:
    post:
      tags:
      - Neoh→HIS · Paciente & Cadastro
      operationId: cadastroCompleto
      summary: Cria paciente completo (+)
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroCompletoRequest'
            example:
              idBUPUnidade: 61
              NomePaciente: PACIENTE TESTE
              SexoPaciente: M
              DataNascimento: '1990-01-01'
              NomeMae: MAE TESTE
              CpfPaciente: '12345678900'
              Email: teste@teste.com
              Cep: 01000-000
              Endereco: RUA TESTE
              Numero: 100
              Bairro: CENTRO
              Cidade: SAO PAULO
              Uf: SP
      responses:
        '200':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  codPaciente:
                    type: integer
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
      description: '**Escopo:** comum a todos os HIS.'
  /gerar-horario-livre:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: gerarHorarioLivre
      summary: Gera vagas livres (fire-and-forget)
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
      - name: salas
        in: query
        required: true
        schema:
          type: string
        description: CSV de códigos de agenda
      - name: dataInicio
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFim
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: usuario
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Corpo vazio — fire-and-forget, cliente não consome o body
          content:
            application/json:
              schema:
                type: object
                description: Sempre `{}`.
        '400':
          description: Campo obrigatório ausente, ou dataInicio posterior a dataFim (comparação lexicográfica
            YYYY-MM-DD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
      description: '**Escopo:** comum a todos os HIS.'
  /cancelar:
    post:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: cancelarAgenda
      summary: Cancela agendamento cirúrgico (POST — contrato novo ou rota antiga)
      description: '**Escopo:** comum a todos os HIS.



        Perfil **Token**, por POST. O mesmo parâmetro de URL (`barramento_external_rota_post_cancelar_pedido`)
        atende três caminhos no código, escolhidos por configuração do hospital:


        1. `barramento_usar_rota_antiga_cancelar` ligado → **rota antiga**, corpo `CancelamentoAgendaAntigoRequest`
        (camelCase, com `cdPerfil`);

        2. senão, `barramento_mdm_client_id` preenchido → perfil **MDM**, que usa o `DELETE` desta mesma
        rota;

        3. senão → **contrato novo**, corpo `CancelamentoAgendaRequest` (PascalCase) — é o padrão.


        Quem for implementar hoje deve expor o contrato novo. O Neoh não consome o corpo da resposta desta
        rota: o resultado é avaliado pelo status HTTP.

        '
      x-perfil-integracao: token
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CancelamentoAgendaRequest'
              - $ref: '#/components/schemas/CancelamentoAgendaAntigoRequest'
            example:
              CdAvisoCirurgia: '3688948222'
              CdCancelamento: 1
              CdMultiEmpresa: 12
              UsuarioHis: NEOH
              DsObservacoes: Paciente desistiu
              DataInicioCirurgia: '2026-09-20 08:00:00'
              IdSala: 45
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: integer
                  mensagem:
                    type: string
                  agendaPaciente:
                    type: integer
                  numeroCirurgia:
                    type: string
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
    delete:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: cancelarAgendaMdm
      summary: Cancela agendamento cirúrgico (perfil MDM)
      description: '**Escopo:** comum a todos os HIS.



        Perfil **MDM**. Os dados vão na própria URL, não em corpo.


        Depois do cancelamento o Neoh dispara a regeração dos horários livres da sala.'
      x-perfil-integracao: mdm
      security:
      - bearerAuth: []
      parameters:
      - name: nrSeqAgendaPaciente
        in: query
        required: true
        schema:
          type: integer
        description: Sequencial da agenda do paciente a cancelar (NR_SEQ_AGENDA).
      - name: nmUsuario
        in: query
        required: true
        schema:
          type: string
        description: Login do usuário no HIS.
      - name: cdMotivo
        in: query
        required: true
        schema:
          type: integer
        description: Código do motivo de cancelamento.
      - name: dsObservacao
        in: query
        required: true
        schema:
          type: string
        description: Descrição/observação do cancelamento.
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  numeroCirurgia:
                    type: string
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
  /mapa-cirurgico:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: mapaCirurgico
      summary: Mapa de horários e equipamentos de um bloco
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
        description: Código do estabelecimento.
      - name: idBloco
        in: query
        required: true
        schema:
          type: integer
        description: Id do bloco.
      - name: data
        in: query
        required: true
        schema:
          type: string
        description: Data de referência (yyyy-MM-dd HH:mm:ss).
      - name: diaSemana
        in: query
        required: true
        schema:
          type: integer
        description: Dia da semana.
      - name: usuario
        in: query
        required: true
        schema:
          type: string
        description: Login do usuário.
      - name: codigosEquipamento
        in: query
        required: false
        schema:
          type: string
        description: CSV de códigos de equipamento. Se presente, popula as listas de equipamento.
      responses:
        '200':
          description: Mapa cirúrgico (objeto composto).
          content:
            application/json:
              schema:
                type: object
                properties:
                  HorariosLivres:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioLivre'
                  HorariosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioOcupado'
                  horariosEquipamentosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoOcupado'
                  horariosEquipamentosDisponiveis:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoDisponivel'
              example:
                HorariosLivres:
                - id: 1
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 08:00:00'
                  dataFim: '2023-06-30 08:30:00'
                  status: L
                HorariosOcupados:
                - id: 1
                  cdAviso: 123456
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 09:30:00'
                  dataFim: '2023-06-30 10:30:00'
                  duracao: '2023-06-30 01:00:00'
                  tempoLimpeza: '2023-06-30 00:10:00'
                  status: O
                  dsCirurgia: Artrodese de coluna
                  idMedico: 65422
                  nmMedico: Médico fulano de tal
                horariosEquipamentosOcupados:
                - IDEQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  DATAINICIO: '2023-06-30 13:00:00'
                  DATAFIM: '2023-06-30 15:00:00'
                  IDSALA: 1
                  QTDUTILIZADA: 1
                horariosEquipamentosDisponiveis:
                - ID_EQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  QT_DISPONIVEL: 4
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: '**Escopo:** comum a todos os HIS.



        Mapa de horários (livres/ocupados) e equipamentos de um bloco em uma data. Origem no código: `Barramento.cs
        › ListarDadosMapaCirurgicoAsync` e DTOs relacionados (`MapaCirurgicoBarramentoDto`, `HorarioLivreBarramentoDto`,
        `HorarioOcupadoBarramentoDto`, `HorarioEquipamentoOcupadoBarramentoDto`, `EquipamentoDisponivelBarramentoDto`).'
      x-escopo: geral
  /dados-referencia:
    get:
      tags:
      - Neoh→HIS · Dados de Referência
      operationId: dadosReferencia
      summary: Tabelas de referência (19 entidades)
      security:
      - bearerAuth: []
      parameters:
      - name: entidade
        in: query
        required: true
        schema:
          type: string
          enum:
          - bloco
          - conselho
          - equipamento
          - fornecedor
          - motivo-cancelamento
          - motivo-transferencia
          - opme
          - procedimento
          - sala
          - tipo-uti
          - sangue
          - caixa
          - especialidade
          - convenio
          - plano
          - categoria
          - cobertura
          - medico
          - anestesista
        description: Entidade de lookup
      - name: cdEstabelecimento
        in: query
        required: false
        schema:
          type: integer
        description: Obrigatório para bloco/equipamento/motivo-cancelamento/motivo-transferencia/opme/sala/tipo-uti/caixa/convenio/medico;
          ignorado nas demais.
      - name: idConvenio
        in: query
        required: false
        schema:
          type: integer
        description: Opcional em plano/categoria; OBRIGATÓRIO em cobertura.
      - name: tipoAgenda
        in: query
        required: false
        schema:
          type: string
          default: T
        description: Só motivo-cancelamento
      - name: situacao
        in: query
        required: false
        schema:
          type: string
          default: A
        description: Só motivo-cancelamento
      responses:
        '200':
          description: Array puro (14 entidades) OU envelope de objeto (5 entidades). O formato depende
            de `entidade` — ver tabela na descrição.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Bloco'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Conselho'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Equipamento'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Fornecedor'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_MotivoCancelamento'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_MotivoTransferencia'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Procedimento'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_ProcedimentoMdm'
                - $ref: '#/components/schemas/DR_Opme'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_TipoUti'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Sala'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Sangue'
                - $ref: '#/components/schemas/DR_Caixa'
                - $ref: '#/components/schemas/DR_Especialidade'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Convenio'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Plano'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Categoria'
                - type: array
                  items:
                    $ref: '#/components/schemas/DR_Cobertura'
                - $ref: '#/components/schemas/DR_Medico'
                - $ref: '#/components/schemas/DR_Anestesista'
              examples:
                bloco_array_puro:
                  summary: entidade=bloco (array puro)
                  value:
                  - ID_BLOCO: 1
                    DS_BLOCO: Bloco A
                opme_envelope_Dados:
                  summary: entidade=opme (envelope Dados)
                  value:
                    Dados:
                    - CD_PRODUTO: 123
                      DS_PRODUTO: Prótese X
                      CD_PRO_FAT: '123'
                      CD_TUSS: 789
                      CD_SUS: '123'
                especialidade_envelope:
                  summary: entidade=especialidade (envelope Especialidades)
                  value:
                    Especialidades:
                    - idBupEspecialidade: 10
                      nomeEspecialidade: Ortopedia
                anestesista_envelope:
                  summary: entidade=anestesista (envelope Profissionais)
                  value:
                    Profissionais:
                    - IdMedico: 1
                      Cpf: '12345678901'
                      Nome: Dr. Fulano
                      CustomId: 1
                      Email: a@a.com
                      Numero: '999999999'
        '400':
          description: 'Campo obrigatório ausente (ex.: idConvenio em cobertura)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: '**Escopo:** comum a todos os HIS.



