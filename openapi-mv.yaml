  /integrar-anexo-blob:
    post:
      tags:
      - Neoh→HIS · Edição de Pedido
      operationId: integrarAnexoBlob
      summary: Anexo com o arquivo em Base64 (uma requisição por arquivo)
      description: '**Escopo:** comum a todos os HIS.



        Fluxo de anexo com o **binário embutido em Base64**, resolvido pelo parâmetro `barramento_rota_integrar_anexos`.
        Quando esse parâmetro está configurado, é este o caminho usado; sem ele, o Neoh cai no fluxo por
        caminho de arquivo (`/integrar-anexo`).


        O Neoh envia **uma requisição por arquivo** — o array `Anexos` sempre chega com um item — e só
        envia anexo com binário. O corpo cresce cerca de 33% sobre o tamanho do arquivo, então vale alinhar
        o limite de tamanho de requisição no HIS. Este fluxo cobre apenas a inclusão; a remoção é feita
        pelo `/integrar-anexo`, com `action: delete`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnexoBlobRequest'
            example:
              CdAvisoCirurgia: '3688948222'
              CdMultiEmpresa: 61
              UsuarioHis: NEOH
              NomePaciente: MARIA DA SILVA
              Anexos:
              - TipoDocumento: 1
                Extensao: pdf
                FileName: exame-pre-operatorio.pdf
                Blob: JVBERi0xLjQKJc...
      responses:
        '200':
          description: 'Anexo recebido. O Neoh não desserializa o corpo desta resposta — avalia só o status
            HTTP —, mas recomenda-se devolver o identificador do anexo criado, para rastreabilidade.

            '
        '400':
          description: Falha na inclusão do anexo (aviso inexistente, tipo inválido, Base64 malformado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
