    AgendaPacienteRequest:
      type: object
      description: 'Corpo da cabeça da agenda cirúrgica, exatamente como o Neoh o envia (objeto `AgendaPaciente`
        do barramento, conferido campo a campo contra o código). Onde o HIS aceita um nome equivalente,
        o alias vem anotado no próprio campo.


        O HIS também aceita, mas o Neoh **não envia**: `cdProcedimento`, `statusAgenda`, `ieOrigemProced`,
        `idMedico`, `idCategoriaConvenio`, `nrSeqProcInterno`, `usuarioOrigem`, `dtAgendamento` e `cdPerfil`
        — os procedimentos vão na rota própria (`/integrar-pedido/cirurgia-procedimento`).

        '
      required:
      - idAgenda
      - idBupUnidade
      - loginUsuario
      properties:
        idAgenda:
          type: integer
          format: int64
          description: Código da agenda no HIS. O HIS aceita o alias `nrSequencia`.
          example: 123456
        idBupUnidade:
          type: integer
          description: Código corporativo da unidade (estabelecimento) no HIS.
          example: 1
        loginUsuario:
          type: string
          description: Login do usuário no HIS. O HIS aceita o alias `login`.
          example: daniel.koga
        idBupProfissional:
          type: integer
          format: int64
          nullable: true
          description: Código do anestesista no HIS.
        dtNascimento:
          type: string
          nullable: true
          description: Data de nascimento do paciente, em `yyyy-MM-dd`.
          example: '1980-04-27'
        idBupConvenio:
          type: integer
          format: int64
          description: Código do convênio no HIS. O HIS aceita o alias `idConvenio`.
        idBupPlano:
          type: string
          description: Código do plano no HIS.
        idCid:
          type: string
          nullable: true
          description: CID principal do pedido; string vazia quando não há.
        idPaciente:
          type: integer
          nullable: true
          description: Código do paciente no HIS.
        novoPaciente:
          type: boolean
          description: '`true` quando o paciente foi cadastrado nesta integração.'
        tipoAcomodacao:
          type: integer
          nullable: true
          description: Tipo de acomodação no HIS. Default 1 quando o pedido não traz.
        numeroCarteira:
          type: string
          nullable: true
        validadeCarteira:
          type: string
          nullable: true
          description: Validade da carteirinha, em `yyyy-MM-dd`.
        observacoesExtras:
          type: string
          nullable: true
        dtPrevistaInternacao:
          type: string
          nullable: true
          description: Data prevista de internação, em `yyyy-MM-dd HH:mm:ss`.
        possuiSangue:
          type: string
          enum:
          - S
          - N
          description: Reserva de sangue.
        possuiEquipamento:
          type: string
          enum:
          - S
          - N
          description: Há equipamentos no pedido.
        reservaLeito:
          type: string
          nullable: true
        reservaUti:
          type: string
          enum:
          - S
          - N
        tecnica:
          type: string
          enum:
          - S
          - N
          description: '`S` quando a técnica é vídeo.'
        caraterAtendimento:
          type: string
          description: Código do caráter de atendimento no HIS. O HIS aceita o alias `catAtendimento`.
        nmPaciente:
          type: string
        duracaoCirurgia:
          type: integer
          description: Duração prevista, em minutos.
        qtdDiasInternacao:
          type: integer
        telefone:
          type: string
          nullable: true
        qtIdadePaciente:
          type: integer
          description: Idade em anos, calculada pelo Neoh.
        qtIdadeMes:
          type: integer
          description: Idade em meses, calculada pelo Neoh.
        cdAgenda:
          type: integer
          nullable: true
          description: Código da sala cirúrgica no HIS.
        dtAgenda:
          type: string
          nullable: true
          description: Data da cirurgia, em `yyyy-MM-dd`.
        hrInicio:
          type: string
          nullable: true
          description: Início da cirurgia, em `yyyy-MM-dd HH:mm:ss`.
        nrReserva:
          type: string
          nullable: true
          description: Número da reserva devolvido pela consulta de agenda.
        ieAnestesia:
          type: string
          nullable: true
          description: Origem/tipo de anestesia.
        ieTipoAtendimento:
          type: integer
          description: Origem da internação, no código do HIS.
        canalAgendamento:
          type: integer
          description: Canal de agendamento configurado por hospital.
        tipoClassificacao:
          type: integer
          nullable: true
          description: Classificação da gestação.
        idadeGestacional:
          type: integer
          nullable: true
        procedenciaAgendamento:
          type: integer
          nullable: true
        nrAtendimento:
          type: integer
          nullable: true
          description: Código do atendimento no HIS, quando já existe.
        tipoAgendamento:
          type: integer
          nullable: true
          description: Eletiva ou encaixe, conforme o caráter do atendimento.
        honorariosMedico:
          type: integer
          nullable: true
