      - Neoh→HIS · Reintegrar Pedido
      operationId: reintegrarProcedimentoRemover
      summary: Remove procedimentos de um pedido já integrado
      description: '**Escopo:** comum a todos os HIS.



        POST, não DELETE: a remoção é informada pela URL chamada, e o corpo é a mesma lista das outras
        duas rotas.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReintegrarProcedimentoItem'
      responses:
        '200':
          description: Procedimentos removidos.
        '401':
          description: Token inválido ou expirado.
      x-escopo: geral
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token do Barramento (sentido Neoh→HIS). Obtido em POST /token.
    clientId:
      type: apiKey
      in: header
      name: client_id
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
    clientSecret:
      type: apiKey
      in: header
      name: client_secret
      description: Callbacks HIS→Neoh. Fornecido pela Intelectah por ambiente.
  schemas:
    ReintegrarProcedimentoItem:
      type: object
      description: Item de procedimento nas três rotas de reintegração (`SolicitacaoProcedimentoBarramentoDTO`).
        O mesmo objeto serve para acrescentar, trocar o principal e remover.
      required:
      - nrSeqAgenda
      - nmUsuario
      - nrSeqProcInterno
      - cdEstabelecimento
      properties:
        nrSeqAgenda:
          type: string
          description: Código do aviso cirúrgico, enviado como texto.
        nmUsuario:
          type: string
          description: Login do usuário no HIS.
        nrSeqProcInterno:
          type: integer
          format: int64
          description: Código do procedimento na tabela interna do HIS.
        cdEstabelecimento:
          type: integer
          description: Código corporativo da unidade.
        ieLado:
          type: string
          description: Lateralidade, já convertida para o valor que o HIS espera.
        cdMedico:
          type: string
          description: Código do médico no HIS.
        cdConvenio:
          type: string
        cdCategoria:
          type: string
          description: Declarado no objeto mas **nunca preenchido** pelo Neoh — vai sempre nulo.
        cdPlano:
          type: string
        qtMinProc:
          type: integer
          description: Quantidade do procedimento.
    RespostaErroNeoh:
      type: object
      description: Envelope de erro padrão do Barramento (WrapError, incondicional).
      properties:
        sucesso:
          type: integer
          example: 0
        mensagem:
          type: string
    MensagemResposta:
      type: object
      description: Resposta padrão dos callbacks HIS→Neoh (sucesso e 400 individual).
      properties:
        Message:
