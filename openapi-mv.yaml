        **lista** — um objeto por procedimento incluído.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReintegrarProcedimentoItem'
            example:
            - nrSeqAgenda: '3688948222'
              nmUsuario: NEOH
              nrSeqProcInterno: 40201015
              cdEstabelecimento: 61
              ieLado: D
              cdMedico: '1234'
              cdConvenio: '9'
              cdPlano: '3'
              qtMinProc: 1
      responses:
        '200':
          description: Procedimentos acrescentados.
        '401':
          description: Token inválido ou expirado.
      x-escopo: geral
  /reintegrar/procedimento-principal:
    post:
      tags:
      - Neoh→HIS · Reintegrar Pedido
      operationId: reintegrarProcedimentoPrincipal
      summary: Troca o procedimento principal do pedido
      description: '**Escopo:** comum a todos os HIS.



        Mesma lista da rota de inclusão. O Neoh monta o corpo passando `principal = true`, mas **o objeto
        enviado é idêntico** ao das outras duas rotas: o código tem um `if/else` cujos dois ramos constroem
        o mesmo objeto. Quem diferencia é a URL chamada, não o conteúdo.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ReintegrarProcedimentoItem'
      responses:
        '200':
          description: Procedimento principal trocado.
        '401':
          description: Token inválido ou expirado.
      x-escopo: geral
