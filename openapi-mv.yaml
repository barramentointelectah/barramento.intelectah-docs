openapi: 3.0.3
info:
  title: Barramento de Integração — Neoh × HIS · MV
  version: '1.0'
  description: 'Documentação do barramento para hospitais **MV**: as rotas comuns a qualquer HIS mais
    as específicas do MV.


    A documentação do barramento é separada por HIS: **Geral** (vale para qualquer HIS), **Tasy** e **MV**.
    Cada operação traz o seu escopo no início da descrição. As abas Tasy e MV são autocontidas — trazem
    as rotas comuns mais as do seu HIS —, então quem integra um hospital Tasy lê só a aba Tasy.


    Os callbacks **HIS → Neoh** valem para qualquer HIS.


    ---


    Barramento de integração entre o **Neoh** (agendamento cirúrgico) e o **HIS** (sistema de gestão hospitalar).
    Especificação genérica de contrato — independente do HIS de destino.


    Documentado nos **dois sentidos**:


    - **Neoh → HIS**: rotas que o Neoh consome do barramento. Autenticação por **Bearer token**; base
    no servidor do HIS (`{baseUrl}`).

    - **HIS → Neoh**: callbacks que o HIS envia à API do Neoh. Autenticação por headers **`client_id`/`client_secret`**;
    base no servidor do Neoh.

    - **Perfis de integração**: algumas rotas do sentido Neoh → HIS têm duas variantes, **Token** e **MDM**,
    com verbo e corpo diferentes. O perfil vigente é definido por configuração do hospital. Cada operação
    declara o seu em `x-perfil-integracao`. Hoje isso afeta `/cancelar` e `/troca-fase`.

    - **Estado de implementação**: as rotas marcadas com `x-implementacao` têm o contrato publicado mas
    ainda não são consumidas pelo Neoh nesta versão.


    Cada operação declara em `servers` a base correta e o `security` do seu sentido. Onde o corpo de resposta
    não tem schema de campos publicado, isso é indicado explicitamente na descrição da rota.'
servers:
- url: '{baseUrl}'
  description: Base do HIS (barramento). Usada por TODAS as rotas do sentido Neoh → HIS. Host + prefixo
    do barramento, fornecido pela Intelectah/HIS por ambiente.
  variables:
    baseUrl:
      default: https://barramento.hospital.example
      description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
- url: https://neohapi{ambiente}-eastus2.azurewebsites.net
  description: Base da API do Neoh. Usada pelos callbacks do sentido HIS -> Neoh.
  variables:
    ambiente:
      enum:
      - hml
      - prd
      default: hml
      description: Hml = neohapihml-eastus2; prd = neohapiprd-eastus2.
tags:
- name: Neoh→HIS · Autenticação
  description: Emissão do Bearer token do Barramento (credenciais em headers `client_id`/`client_secret`/`grant_type`).
- name: Neoh→HIS · Dados de Referência
  description: Endpoint único /dados-referencia com 19 entidades de lookup selecionadas por `entidade`.
- name: Neoh→HIS · Agenda & Mapa
  description: Consulta de disponibilidade, geração de horários, atualização e cancelamento de agenda,
    mapa cirúrgico.
- name: Neoh→HIS · Consulta de Paciente
  description: Localizar um paciente que já existe no HIS, antes de montar o pedido. A busca tem dois
    modos e muda de forma conforme o perfil de integração do hospital.
- name: Neoh→HIS · Cadastro de Paciente
  description: Criar no HIS um paciente que o Neoh ainda não encontrou pela consulta, para que o pedido
    cirúrgico possa ser integrado em seguida.
- name: Neoh→HIS · Integrar Pedido
  description: Criação/atualização/remoção dos itens de um Pedido Cirúrgico. 15 áreas sob /integrar-pedido/*,
    todas POST, roteando por campo `action` no item.
- name: Neoh→HIS · Reintegrar Pedido
  description: 'Correção de um pedido JÁ integrado, item a item, sem reenviar o pedido inteiro. Quem dispara
    é a edição de um pedido na tela: `ReintegracaoApp` decide a operação e o barramento traduz para uma
    das duas formas abaixo.


    **1. As rotas de `/integrar-pedido/*`, reenviadas com UM item e o campo `action`.** São exatamente
    as mesmas rotas da carga inicial — o que muda é que a lista traz um item só e ele carrega a ação:


    | Operação na tela | Rota | `action` |

    |---|---|---|

    | Incluir equipamento | `/integrar-pedido/cirurgia-equipamento` | `new` |

    | Remover equipamento | `/integrar-pedido/cirurgia-equipamento` | `delete` |

    | Incluir / editar sangue | `/integrar-pedido/cirurgia-sangue` | `new` / `update` |

    | Remover sangue | `/integrar-pedido/cirurgia-sangue` | `delete` |

    | Incluir / remover exame | `/integrar-pedido/cirurgia-exame` | `new` / `delete` |

    | Incluir / editar caixa | `/integrar-pedido/cirurgia-caixas` | `new` / `update` |

    | Remover caixa | `/integrar-pedido/cirurgia-caixas` | `delete` |

    | Incluir / editar / remover OPME | `/integrar-pedido/cirurgia-opme` | `new` / `update` / `delete`
    |

    | Incluir / editar / remover material | `/integrar-pedido/cirurgia-material` | `new` / `update` /
    `delete` |

    | Incluir / editar / remover procedimento | `/integrar-pedido/cirurgia-procedimento` | `new` / `update`
    / `delete` |

    | Trocar o procedimento principal | `/integrar-pedido/cirurgia-procedimento` | os três, na mesma chamada
    |

    | Reintegrar o pedido inteiro | `/agenda-paciente` | — (reenvia o cabeçalho) |


    **Editar equipamento não envia nada ao HIS:** o código só reintegra inclusão e remoção de equipamento.


    **2. As seis rotas desta seção**, com URL própria por hospital e autenticação Basic. Se o hospital
    não tiver a URL configurada, elas não fazem nada — retornam em silêncio.


    Nenhum dos dois caminhos é escolhido por HIS no código: valem conforme o hospital tenha o parâmetro
    `barramento_external_api` ligado e as URLs configuradas. Vale saber, porém, que num hospital MV a
    **carga inicial** não passa por nenhuma rota de `/integrar-pedido/cirurgia-*` — ela vai inteira num
    único POST para `/integrar-pedido/agenda-cirurgica`. As rotas por item são o desenho do Tasy, e é
    nelas que a edição cai de qualquer jeito.'
- name: Neoh→HIS · Troca de Fase
  description: 'Avanço do pedido pelo workflow do HIS: troca de fase do pedido e, no perfil MDM, também
    o estágio da autorização. O cancelamento de guia usa este mesmo mecanismo — mover a guia para o estágio
    de cancelamento configurado no hospital.'
- name: Neoh→HIS · Integrar Anexo
  description: 'Envio de anexos do pedido para o HIS. Há duas formas, e o hospital usa uma ou outra: por
    caminho de arquivo, ou com o arquivo embutido em Base64.'
- name: Neoh→HIS · Cancelamento
  description: Cancelamento de um pedido cirúrgico já integrado e das guias de convênio que ele gerou.
    O cancelamento do agendamento tem três caminhos no código, escolhidos por configuração do hospital
    — perfil MDM, contrato novo ou rota antiga — e o mesmo parâmetro de URL atende os três. As guias de
    convênio são canceladas à parte, por troca de estágio.
- name: HIS→Neoh · Callbacks
  description: Callbacks que o HIS envia para a API do Neoh. Base = servidor Neoh; auth por headers client_id/client_secret.
security:
- bearerAuth: []
paths:
  /token:
    post:
      tags:
      - Neoh→HIS · Autenticação
      operationId: emitirToken
      summary: Emite o Bearer token (client_credentials)
      description: '**Escopo:** comum a todos os HIS.



        Credenciais enviadas em **headers**. A requisição não tem corpo.


        O token devolvido é aplicado nas demais rotas do sentido Neoh → HIS no header `Authorization:
        {token_type} {access_token}`.'
      security: []
      servers:
      - url: '{baseUrl}'
        description: Base do HIS (barramento). Usada por todas as rotas do sentido Neoh → HIS.
        variables:
          baseUrl:
            default: https://barramento.hospital.example
            description: Host + prefixo do barramento do HIS. Fornecido pela Intelectah/HIS por ambiente.
      parameters:
      - name: client_id
        in: header
        required: true
        schema:
          type: string
          example: neoh
        description: Identificador de acesso, fornecido pela equipe do barramento.
      - name: client_secret
        in: header
        required: true
        schema:
          type: string
          example: neoh123
        description: Segredo de acesso, fornecido pela equipe do barramento.
      - name: grant_type
        in: header
        required: true
        schema:
          type: string
          enum:
          - client_credentials
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - token_type
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    description: Validade do token, em segundos.
                    example: 3600
              example:
                access_token: abc1234
                token_type: bearer
                expires_in: 3600
        '400':
          description: Credenciais ausentes ou malformadas.
        '401':
          description: Credenciais inválidas.
      x-escopo: geral
  /consultar-paciente:
    get:
      tags:
      - Neoh→HIS · Consulta de Paciente
      operationId: consultarPaciente
      summary: Localiza o paciente no HIS (2 modos)
      security:
      - bearerAuth: []
      parameters:
      - name: idBupUnidade
        in: query
        required: true
        schema:
          type: integer
        description: Código da unidade.
      - name: nrAtendimento
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 1: número do atendimento no HIS.'
      - name: cpf
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: CPF do paciente (11 dígitos, sem máscara).'
      - name: nome
        in: query
        required: false
        schema:
          type: string
        description: 'Modo 2: nome (ou parte) do paciente.'
      - name: dataNascimento
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 'Modo 2: data de nascimento (yyyy-MM-dd).'
      responses:
        '200':
          description: Envelope com a lista de pacientes encontrados (vazia se nenhum).
          content:
            application/json:
              schema:
                type: object
                properties:
                  consultaPaciente:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConsultaPacienteItem'
              example:
                consultaPaciente:
                - cdPaciente: 456
                  nomePaciente: PACIENTE TESTE
                  sexoPaciente: M
                  dataNascimento: '1980-01-01'
                  nomeMae: MAE TESTE
                  cpfPaciente: '12345678911'
                  email: teste@teste.com
                  ddiCelular: 55
                  dddCelular: 11
                  celular: '999998888'
                  cep: '55555000'
                  endereco: Rua Teste
                  numero: 5
                  bairro: Centro
                  cidade: Recife
                  uf: PE
                  pais: Brasil
                  codigoAtendimento: 123456
                  codigoConvenio: 1
                  dsConvenio: Convenio X
                  codigoPlano: 1
                  dsPlano: Plano Y
                  numeroCarteirinha: '123456789'
                  pacienteOncologico: N
        '400':
          description: Nenhum critério de busca informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
        '401':
          description: Sem token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: '**Escopo:** comum a todos os HIS.



        Consulta o paciente no HIS. Dois modos de busca, ambos retornando o **mesmo envelope** `{ "consultaPaciente":
        [ ... ] }` (array, mesmo para 1 paciente):


        - **Por nº de atendimento** — enviar `idBupUnidade` + `nrAtendimento`.

        - **Por dados do paciente** — enviar `idBupUnidade` + ao menos um de `cpf` / `nome` / `dataNascimento`.


        Origem no código: `Barramento.cs › ConsultarPacienteGeralAsync`, `PacienteBarramentoDTO`, `ItemPacienteBarramentoGeral`.'
      x-escopo: geral
  /cadastro-simplificado:
    post:
      tags:
      - Neoh→HIS · Cadastro de Paciente
      operationId: cadastroSimplificado
      summary: Cria paciente mínimo
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroSimplificadoRequest'
            example:
              nomePaciente: PACIENTE TESTE
              dtNascimento: '1990-01-01'
              sexo: M
              usuario: NEOH
              docPacienteCPF: '12345678900'
      responses:
        '200':
          description: Paciente criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  codPaciente:
                    type: integer
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
      description: '**Escopo:** comum a todos os HIS.'
  /gerar-horario-livre:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: gerarHorarioLivre
      summary: Gera vagas livres (fire-and-forget)
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
      - name: salas
        in: query
        required: true
        schema:
          type: string
        description: CSV de códigos de agenda
      - name: dataInicio
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dataFim
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: usuario
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Corpo vazio — fire-and-forget, cliente não consome o body
          content:
            application/json:
              schema:
                type: object
                description: Sempre `{}`.
        '400':
          description: Campo obrigatório ausente, ou dataInicio posterior a dataFim (comparação lexicográfica
            YYYY-MM-DD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
      description: '**Escopo:** comum a todos os HIS.'
  /cancelar:
    post:
      tags:
      - Neoh→HIS · Cancelamento
      operationId: cancelarAgenda
      summary: Cancela agendamento cirúrgico (POST — contrato novo ou rota antiga)
      description: '**Escopo:** comum a todos os HIS.



        Perfil **Token**, por POST. O mesmo parâmetro de URL (`barramento_external_rota_post_cancelar_pedido`)
        atende três caminhos no código, escolhidos por configuração do hospital:


        1. `barramento_usar_rota_antiga_cancelar` ligado → **rota antiga**, corpo `CancelamentoAgendaAntigoRequest`
        (camelCase, com `cdPerfil`);

        2. senão, `barramento_mdm_client_id` preenchido → perfil **MDM**, que usa o `DELETE` desta mesma
        rota;

        3. senão → **contrato novo**, corpo `CancelamentoAgendaRequest` (PascalCase) — é o padrão.


        Quem for implementar hoje deve expor o contrato novo. O Neoh não consome o corpo da resposta desta
        rota: o resultado é avaliado pelo status HTTP.

        '
      x-perfil-integracao: token
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CancelamentoAgendaRequest'
              - $ref: '#/components/schemas/CancelamentoAgendaAntigoRequest'
            example:
              CdAvisoCirurgia: '3688948222'
              CdCancelamento: 1
              CdMultiEmpresa: 12
              UsuarioHis: NEOH
              DsObservacoes: Paciente desistiu
              DataInicioCirurgia: '2026-09-20 08:00:00'
              IdSala: 45
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  sucesso:
                    type: integer
                  mensagem:
                    type: string
                  agendaPaciente:
                    type: integer
                  numeroCirurgia:
                    type: string
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
    delete:
      tags:
      - Neoh→HIS · Cancelamento
      operationId: cancelarAgendaMdm
      summary: Cancela agendamento cirúrgico (perfil MDM)
      description: '**Escopo:** comum a todos os HIS.



        Perfil **MDM**. Os dados vão na própria URL, não em corpo.


        Depois do cancelamento o Neoh dispara a regeração dos horários livres da sala.'
      x-perfil-integracao: mdm
      security:
      - bearerAuth: []
      parameters:
      - name: nrSeqAgendaPaciente
        in: query
        required: true
        schema:
          type: integer
        description: Sequencial da agenda do paciente a cancelar (NR_SEQ_AGENDA).
      - name: nmUsuario
        in: query
        required: true
        schema:
          type: string
        description: Login do usuário no HIS.
      - name: cdMotivo
        in: query
        required: true
        schema:
          type: integer
        description: Código do motivo de cancelamento.
      - name: dsObservacao
        in: query
        required: true
        schema:
          type: string
        description: Descrição/observação do cancelamento.
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema:
                type: object
                properties:
                  numeroCirurgia:
                    type: string
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: geral
  /suspender:
    post:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: suspenderCirurgia
      summary: Suspende a cirurgia agendada
      description: '**Escopo:** especifico do **MV**.



        Aciona a suspensão de uma solicitação já agendada. Resolvida pelo parâmetro `barramento_rota_suspensao`,
        configurado por hospital.


        Não confundir com o cancelamento: a suspensão mantém o agendamento e registra o motivo, enquanto
        `/cancelar` encerra o aviso cirúrgico.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspensaoCirurgiaRequest'
            example:
              CdMultiEmpresa: 1
              CdAvisoCirurgia: '123456'
              CdMotivoSuspensao: 50
              UsuarioHis: '122345'
              DsObservacoes: Observações da suspensão
      responses:
        '200':
          description: Suspensão registrada. O Neoh avalia apenas o status HTTP.
        '500':
          description: Falha ao suspender; o corpo traz a mensagem de erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      x-escopo: mv
  /mapa-cirurgico:
    get:
      tags:
      - Neoh→HIS · Agenda & Mapa
      operationId: mapaCirurgico
      summary: Mapa de horários e equipamentos de um bloco
      security:
      - bearerAuth: []
      parameters:
      - name: cdEstabelecimento
        in: query
        required: true
        schema:
          type: integer
        description: Código do estabelecimento.
      - name: idBloco
        in: query
        required: true
        schema:
          type: integer
        description: Id do bloco.
      - name: data
        in: query
        required: true
        schema:
          type: string
        description: Data de referência (yyyy-MM-dd HH:mm:ss).
      - name: diaSemana
        in: query
        required: true
        schema:
          type: integer
        description: Dia da semana.
      - name: usuario
        in: query
        required: true
        schema:
          type: string
        description: Login do usuário.
      - name: codigosEquipamento
        in: query
        required: false
        schema:
          type: string
        description: CSV de códigos de equipamento. Se presente, popula as listas de equipamento.
      responses:
        '200':
          description: Mapa cirúrgico (objeto composto).
          content:
            application/json:
              schema:
                type: object
                properties:
                  HorariosLivres:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioLivre'
                  HorariosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaHorarioOcupado'
                  horariosEquipamentosOcupados:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoOcupado'
                  horariosEquipamentosDisponiveis:
                    type: array
                    items:
                      $ref: '#/components/schemas/MapaEquipamentoDisponivel'
              example:
                HorariosLivres:
                - id: 1
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 08:00:00'
                  dataFim: '2023-06-30 08:30:00'
                  status: L
                HorariosOcupados:
                - id: 1
                  cdAviso: 123456
                  idSala: 1
                  nmSala: Sala CC 01
                  dataInicio: '2023-06-30 09:30:00'
                  dataFim: '2023-06-30 10:30:00'
                  duracao: '2023-06-30 01:00:00'
                  tempoLimpeza: '2023-06-30 00:10:00'
                  status: O
                  dsCirurgia: Artrodese de coluna
                  idMedico: 65422
                  nmMedico: Médico fulano de tal
                horariosEquipamentosOcupados:
                - IDEQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  DATAINICIO: '2023-06-30 13:00:00'
                  DATAFIM: '2023-06-30 15:00:00'
                  IDSALA: 1
                  QTDUTILIZADA: 1
                horariosEquipamentosDisponiveis:
                - ID_EQUIPAMENTO: 150
                  CdMultiEmpresa: 1
                  QT_DISPONIVEL: 4
        '400':
          description: Campo obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErroNeoh'
      description: '**Escopo:** comum a todos os HIS.



        Mapa de horários (livres/ocupados) e equipamentos de um bloco em uma data. Origem no código: `Barramento.cs
        › ListarDadosMapaCirurgicoAsync` e DTOs relacionados (`MapaCirurgicoBarramentoDto`, `HorarioLivreBarramentoDto`,
        `HorarioOcupadoBarramentoDto`, `HorarioEquipamentoOcupadoBarramentoDto`, `EquipamentoDisponivelBarramentoDto`).'
      x-escopo: geral
  /dados-referencia:
    get:
      tags:
      - Neoh→HIS · Dados de Referência
      operationId: dadosReferencia
      summary: Tabelas de referência (19 entidades)
      security:
      - bearerAuth: []
      parameters:
      - name: entidade
        in: query
        required: true
        schema:
          type: string
          enum:
          - bloco
          - conselho
          - equipamento
          - fornecedor
          - motivo-cancelamento
          - motivo-transferencia
          - opme
          - procedimento
          - sala
          - tipo-uti
          - sangue
          - caixa
          - especialidade
          - convenio
          - plano
          - categoria
          - cobertura
          - medico
          - anestesista
        description: Entidade de lookup
      - name: cdEstabelecimento
        in: query
        required: false
        schema:
          type: integer
        description: Obrigatório para bloco/equipamento/motivo-cancelamento/motivo-transferencia/opme/sala/tipo-uti/caixa/convenio/medico;
          ignorado nas demais.
      - name: idConvenio
        in: query
        required: false
        schema:
          type: integer
